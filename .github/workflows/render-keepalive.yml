name: Keep Render test deploy awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake API
        run: curl -sS --retry 8 --retry-all-errors --retry-delay 8 --max-time 90 https://qiko-v2-api.onrender.com/health
      - name: Wake Creator
        run: curl -sS --retry 8 --retry-all-errors --retry-delay 8 --max-time 90 https://qiko-v2-creator.onrender.com/health
