name: Enable audit append-only

# Manual only, one environment at a time, with a typed confirmation.
#
# This turns audit_events append-only for the application role: after it runs, nothing in the API can
# UPDATE or DELETE an audit row, and retention and erasure run through a separate maintenance role. It is
# the control behind the phrase "immutable audit log", and it is a privilege change, so it is a deliberate
# click rather than something a merge performs.
#
# Deliberately NOT wired into the deploy workflows. A boundary that gets enabled by an unrelated merge is
# one nobody can say when they enabled, and the evidence request is "when did this come into force".
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [preprod, live]
      confirm:
        # Typed, not a checkbox. The failure mode this guards is picking `live` from the dropdown while
        # meaning `preprod`, which a checkbox does nothing about.
        description: Type the environment name again to confirm
        required: true
        type: string

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the confirmation matches the target
        run: |
          if [ "${{ inputs.confirm }}" != "${{ inputs.environment }}" ]; then
            echo "Confirmation '${{ inputs.confirm }}' does not match target '${{ inputs.environment }}'." >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.environment == 'live' && secrets.LIVE_DEPLOY_ROLE_ARN || secrets.PREPROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run via SSM
        id: run
        env:
          INSTANCE_ID: ${{ inputs.environment == 'live' && secrets.LIVE_INSTANCE_ID || secrets.PREPROD_INSTANCE_ID }}
        run: |
          set -e
          if [ "${{ inputs.environment }}" = "live" ]; then
            COMPOSE="-f docker-compose.yml -f docker-compose.live.yml"
          else
            COMPOSE="-f docker-compose.yml -f docker-compose.preprod.yml"
          fi
          # The script is delivered inline, the same way redeploy-*.sh is, so what runs is exactly what
          # is in this commit rather than whatever happens to be on the box.
          { head -n 1 .github/deploy/enable-audit-append-only.sh; \
            printf 'export QIKO_COMPOSE_FILES=%q\n' "$COMPOSE"; \
            tail -n +2 .github/deploy/enable-audit-append-only.sh; } \
            | jq -Rs '{commands: [.]}' > /tmp/enable.json
          CMD_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file:///tmp/enable.json \
            --timeout-seconds 900 --query "Command.CommandId" --output text)
          echo "Command: $CMD_ID"
          STATUS=Pending
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            echo "status=$STATUS"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done
          # The output is the evidence: it ends with the grants as the database reports them.
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text || true
          [ "$STATUS" = "Success" ] || { echo "SSM status: $STATUS" >&2; exit 1; }

      - name: Readiness check
        run: |
          set -e
          if [ "${{ inputs.environment }}" = "live" ]; then
            URL=https://qiko.ai/api/v1/health/ready
          else
            URL=https://preprod.qiko.ai/api/v1/health/ready
          fi
          # The boundary is a privilege change, so the thing to prove afterwards is that the application
          # can still write. A revoke that accidentally took INSERT would stop every audit row.
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 "$URL" | grep -q '"status":"ready"'; then
              echo "ready"; exit 0
            fi
            sleep 6
          done
          echo "not ready after the change" >&2
          exit 1
