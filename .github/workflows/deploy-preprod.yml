name: Deploy Preprod

# SCRUM-3: push to main auto-deploys to preprod (fast-forwards the `preprod` branch, redeploys
# via SSM Run Command on the preprod box, health-checks, and rolls back on failure).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-preprod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Fast-forward preprod branch to this commit
        run: git push origin HEAD:refs/heads/preprod --force

      - name: Deploy via SSM
        id: deploy
        run: |
          set -e
          jq -Rs '{commands: [.]}' < .github/deploy/redeploy-preprod.sh > /tmp/redeploy.json
          CMD_ID=$(aws ssm send-command --instance-ids "${{ secrets.PREPROD_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --parameters file:///tmp/redeploy.json \
            --timeout-seconds 600 --query "Command.CommandId" --output text)
          echo "Command: $CMD_ID"
          STATUS=Pending
          for i in $(seq 1 40); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ secrets.PREPROD_INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo Pending)
            echo "status=$STATUS"
            [[ "$STATUS" =~ ^(Success|Failed|Cancelled|TimedOut)$ ]] && break
            sleep 15
          done
          [[ "$STATUS" == "Success" ]] || { echo "::error::deploy command ended with $STATUS"; exit 1; }

      - name: Health check
        id: health
        run: |
          ok=false
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://preprod.qiko.ai/api/v1/health || echo 000)
            echo "health=$CODE"
            if [[ "$CODE" == "200" ]]; then ok=true; break; fi
            sleep 10
          done
          [[ "$ok" == "true" ]] || exit 1

      - name: Rollback preprod branch on failure
        if: failure()
        run: |
          set -e
          PREV=$(git rev-parse HEAD~1)
          echo "Rolling back preprod to $PREV"
          git push origin "$PREV":refs/heads/preprod --force
          jq -Rs '{commands: [.]}' < .github/deploy/redeploy-preprod.sh > /tmp/redeploy.json
          CMD_ID=$(aws ssm send-command --instance-ids "${{ secrets.PREPROD_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --parameters file:///tmp/redeploy.json \
            --timeout-seconds 600 --query "Command.CommandId" --output text)
          echo "Rollback command sent: $CMD_ID"
