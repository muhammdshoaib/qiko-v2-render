name: Deploy Preprod

# Push to main auto-deploys to preprod. Code is shipped to the box via S3 (org policy disables
# deploy keys, so the box no longer git-pulls): CI uploads a `git archive` tarball, then triggers
# the redeploy via SSM Run Command, health-checks, and rolls back to the previous artifact on failure.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-preprod
  cancel-in-progress: false

env:
  DEPLOY_BUCKET: qiko-v2-preprod-deploy-064247010239

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PREPROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package immutable code artifact and checksum
        run: |
          set -e
          # Publish only immutable SHA-addressed artifacts and their checksums.
          # Clean, tracked-files-only source archive (no .git / node_modules / untracked).
          git archive --format=tar.gz -o /tmp/qiko-v2.tar.gz "${{ github.sha }}"
          sha256sum /tmp/qiko-v2.tar.gz | cut -d ' ' -f1 > /tmp/qiko-v2.tar.gz.sha256
          aws s3 cp /tmp/qiko-v2.tar.gz "s3://$DEPLOY_BUCKET/preprod/deploy-${{ github.sha }}.tar.gz"
          aws s3 cp /tmp/qiko-v2.tar.gz.sha256 "s3://$DEPLOY_BUCKET/preprod/deploy-${{ github.sha }}.tar.gz.sha256"

      - name: Deploy via SSM
        id: deploy
        run: |
          set -e
          ARTIFACT_SHA256=$(cat /tmp/qiko-v2.tar.gz.sha256)
          { head -n 1 .github/deploy/redeploy-preprod.sh; printf 'export RELEASE_SHA=%q RELEASE_SHA256=%q\n' '${{ github.sha }}' "$ARTIFACT_SHA256"; tail -n +2 .github/deploy/redeploy-preprod.sh; } | jq -Rs '{commands: [.]}' > /tmp/redeploy.json
          CMD_ID=$(aws ssm send-command --instance-ids "${{ secrets.PREPROD_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --parameters file:///tmp/redeploy.json \
            --timeout-seconds 900 --query "Command.CommandId" --output text)
          echo "Command: $CMD_ID"
          STATUS=Pending
          for i in $(seq 1 70); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ secrets.PREPROD_INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo Pending)
            echo "status=$STATUS"
            [[ "$STATUS" =~ ^(Success|Failed|Cancelled|TimedOut)$ ]] && break
            sleep 15
          done
          if [[ ! "$STATUS" =~ ^(Success|Failed|Cancelled|TimedOut)$ ]]; then
            aws ssm cancel-command --command-id "$CMD_ID"
            for i in $(seq 1 20); do
              STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ secrets.PREPROD_INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo Cancelling)
              [[ "$STATUS" =~ ^(Success|Failed|Cancelled|TimedOut)$ ]] && break
              sleep 10
            done
          fi
          [[ "$STATUS" == "Success" ]] || { echo "::error::deploy command ended with $STATUS"; exit 1; }

      - name: Health check
        run: |
          ok=false
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://preprod.qiko.ai/api/v1/health || echo 000)
            echo "health=$CODE"
            if [[ "$CODE" == "200" ]]; then ok=true; break; fi
            sleep 10
          done
          [[ "$ok" == "true" ]] || exit 1

      - name: Record verified preprod SHA
        run: aws ssm put-parameter --name /qiko/preprod/DEPLOYED_SHA --type String --value "${{ github.sha }}" --overwrite

      - name: Report controlled failure
        if: failure()
        run: |
          echo "::error::Preprod deploy failed. Do not start rollback until the SSM command is terminal."
          echo "Use a reviewed SHA-addressed artifact and verify migration compatibility before rollback."
