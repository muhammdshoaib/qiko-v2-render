name: Deploy Preprod

# Push to main auto-deploys to preprod. Code is shipped to the box via S3 (org policy disables
# deploy keys, so the box no longer git-pulls): CI uploads a `git archive` tarball, then triggers
# the redeploy via SSM Run Command, health-checks, and rolls back to the previous artifact on failure.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-preprod
  cancel-in-progress: false

env:
  DEPLOY_BUCKET: qiko-v2-preprod-deploy-064247010239

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package code and upload to S3 (snapshot previous for rollback)
        run: |
          set -e
          # Keep the currently-live artifact as the rollback target (no-op on the first deploy).
          aws s3 cp "s3://$DEPLOY_BUCKET/preprod/deploy-latest.tar.gz" \
            "s3://$DEPLOY_BUCKET/preprod/deploy-previous.tar.gz" || echo "no existing latest yet"
          # Clean, tracked-files-only source archive (no .git / node_modules / untracked).
          git archive --format=tar.gz -o /tmp/qiko-v2.tar.gz HEAD
          aws s3 cp /tmp/qiko-v2.tar.gz "s3://$DEPLOY_BUCKET/preprod/deploy-${{ github.sha }}.tar.gz"
          aws s3 cp /tmp/qiko-v2.tar.gz "s3://$DEPLOY_BUCKET/preprod/deploy-latest.tar.gz"

      - name: Deploy via SSM
        id: deploy
        run: |
          set -e
          jq -Rs '{commands: [.]}' < .github/deploy/redeploy-preprod.sh > /tmp/redeploy.json
          CMD_ID=$(aws ssm send-command --instance-ids "${{ secrets.PREPROD_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --parameters file:///tmp/redeploy.json \
            --timeout-seconds 900 --query "Command.CommandId" --output text)
          echo "Command: $CMD_ID"
          STATUS=Pending
          for i in $(seq 1 50); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ secrets.PREPROD_INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo Pending)
            echo "status=$STATUS"
            [[ "$STATUS" =~ ^(Success|Failed|Cancelled|TimedOut)$ ]] && break
            sleep 15
          done
          [[ "$STATUS" == "Success" ]] || { echo "::error::deploy command ended with $STATUS"; exit 1; }

      - name: Health check
        run: |
          ok=false
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://preprod.qiko.ai/api/v1/health || echo 000)
            echo "health=$CODE"
            if [[ "$CODE" == "200" ]]; then ok=true; break; fi
            sleep 10
          done
          [[ "$ok" == "true" ]] || exit 1

      - name: Rollback to previous artifact on failure
        if: failure()
        run: |
          set -e
          if aws s3 ls "s3://$DEPLOY_BUCKET/preprod/deploy-previous.tar.gz"; then
            echo "Restoring previous artifact and redeploying..."
            aws s3 cp "s3://$DEPLOY_BUCKET/preprod/deploy-previous.tar.gz" \
              "s3://$DEPLOY_BUCKET/preprod/deploy-latest.tar.gz"
            jq -Rs '{commands: [.]}' < .github/deploy/redeploy-preprod.sh > /tmp/redeploy.json
            CMD_ID=$(aws ssm send-command --instance-ids "${{ secrets.PREPROD_INSTANCE_ID }}" \
              --document-name AWS-RunShellScript \
              --parameters file:///tmp/redeploy.json \
              --timeout-seconds 900 --query "Command.CommandId" --output text)
            echo "Rollback command sent: $CMD_ID"
          else
            echo "No previous artifact to roll back to."
          fi
