# Cost-aware CI: change-detection so only affected jobs run (keeps us inside the GitHub free tier).
# Heavy build/deploy happens on AWS, not here. This workflow only lints and tests.
name: CI

on:
  push:
    branches: [main, dev, preprod, production]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - uses: actions/checkout@v4

      # Every new commit must be authored by the release owner. Deliberately a step in this
      # already-running job rather than its own job, because a separate job bills a whole extra
      # minute per CI run. Commits authored before CUTOFF are grandfathered: this repo predates
      # the rule and rewriting shared history that 8 collaborators have cloned is more dangerous
      # than the drift. Uses the API, so the shallow checkout above is enough.
      - name: Verify commit identity
        env:
          GH_TOKEN: ${{ github.token }}
          CUTOFF: '2026-09-07'
          ALLOWED_EMAILS: 'razvan.baba@icloud.com,80892626+pixelartisanag@users.noreply.github.com'
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            COMMITS=$(gh api --paginate \
              "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits" \
              --jq '.[] | "\(.sha[0:8])|\(.commit.author.date)|\(.commit.author.email)|\(.commit.author.name)"')
          else
            BEFORE="${{ github.event.before }}"
            if [[ -z "$BEFORE" || "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
              echo "Branch created or no before-SHA to compare against; nothing to check."
              exit 0
            fi
            COMMITS=$(gh api "repos/${{ github.repository }}/compare/${BEFORE}...${{ github.sha }}" \
              --jq '.commits[] | "\(.sha[0:8])|\(.commit.author.date)|\(.commit.author.email)|\(.commit.author.name)"')
          fi
          BAD=""
          while IFS='|' read -r sha date email name; do
            if [[ -z "${sha:-}" ]]; then
              continue
            fi
            if [[ "${date%%T*}" < "$CUTOFF" ]]; then
              continue
            fi
            if [[ ",$ALLOWED_EMAILS," != *",$email,"* ]]; then
              BAD+="  $sha  $name <$email>"$'\n'
            fi
          done <<< "$COMMITS"
          if [[ -n "$BAD" ]]; then
            echo "::error::These commits are not authored by the release owner:"
            printf '%s' "$BAD"
            echo "Allowed: $ALLOWED_EMAILS"
            echo "Set GIT_AUTHOR_NAME/GIT_AUTHOR_EMAIL (and the COMMITTER equivalents) when committing."
            exit 1
          fi
          echo "Commit identity OK."

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'qiko-core/**'
              - 'scripts/check_local_contract.py'
              - 'scripts/sync_openapi.py'
              - 'frontend/packages/api-client/openapi.json'
              - '.github/workflows/ci.yml'
            # Note: keep each filter's list contiguous (no interleaved comments). A backend route
            # change regenerates schema.d.ts and can break the Next typecheck, which is why
            # 'qiko-core/**' is in the frontend filter too.
            frontend:
              - 'frontend/**'
              - 'qiko-core/**'
              - 'scripts/dev.sh'
              - 'scripts/check_local_contract.py'
              - 'scripts/sync_openapi.py'
              - 'Caddyfile.dev'
              - 'docker-compose.dev.yml'
              - 'docker-compose.dev.parity.yml'
              - '.env.example'
              - 'docs/playbooks/dev.md'
              - 'README.md'
              - '.github/workflows/ci.yml'
            compose:
              - 'docker-compose*.yml'
              - '.env*.example'
              - 'qiko-core/Dockerfile'
              - 'Caddyfile*'
              - 'scripts/dev.sh'
              - '.github/deploy/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy-preprod.yml'
              - '.github/workflows/deploy-live.yml'

  compose:
    needs: changes
    if: ${{ needs.changes.outputs.compose == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create non-secret Compose environment fixture
        run: |
          umask 077
          printf '%s\n' \
            'POSTGRES_USER=qiko' \
            'POSTGRES_PASSWORD=ci-placeholder' \
            'POSTGRES_DB=qiko' \
            'SESSION_SECRET=ci-placeholder-not-a-secret' > .env
          chmod 600 .env
      - run: docker compose --env-file .env -p qiko-dev -f docker-compose.yml -f docker-compose.dev.yml config --quiet
      - run: docker compose --env-file .env -p qiko-dev -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.dev.parity.yml config --quiet
      - run: docker run --rm -e CREATOR_UPSTREAM=creator:3000 -e ADMIN_UPSTREAM=admin:3001 -v "$PWD/Caddyfile.dev:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile
      - run: docker compose -f docker-compose.yml -f docker-compose.preprod.yml config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.live.yml config --quiet
      - run: bash -n scripts/dev.sh .github/deploy/redeploy-preprod.sh .github/deploy/redeploy-live.sh
      - run: python3 .github/deploy/verify-stateless-recreate.py
      - run: docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile
      - run: docker run --rm -v "$PWD/Caddyfile.live:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile

  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    # Self-hosted on purpose. This job is ~17 min of pytest-with-coverage and, at ~200 runs a
    # month, was on its own about 3,600 GitHub-hosted minutes, which alone blew past the Actions
    # allowance. Self-hosted minutes are free, and the preprod box it runs on sits at ~5% CPU with
    # its burst credits permanently maxed out. The runner is an unprivileged `ghrunner` user whose
    # only extra group is `docker` (needed for the postgres:18 service container below, since
    # AL2023 packages no Postgres 18 and the box has no rootless Docker). Deploy workflows
    # deliberately stay on GitHub-hosted runners so AWS credentials never land on this box.
    runs-on: [self-hosted, qiko-preprod]
    defaults:
      run:
        working-directory: qiko-core
    # Postgres is required for the row-locking tests. On SQLite `with_for_update()` is a silent
    # no-op, so tests/test_agent_store.py and tests/test_db_backed_rfp_tree.py were skipped for want
    # of QIKO_TEST_POSTGRES_URL -- and those are exactly the tests covering the plan worker-limit
    # race and disable-vs-persistence. The guarantees the code relies on were verified nowhere.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: qiko
          POSTGRES_PASSWORD: qiko-ci
          POSTGRES_DB: qiko_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qiko -d qiko_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QIKO_TEST_POSTGRES_URL: postgresql+asyncpg://qiko:qiko-ci@localhost:5432/qiko_test
    steps:
      - uses: actions/checkout@v4
      # No actions/setup-python here on purpose: it ships no build for Amazon Linux 2023 (the
      # self-hosted runner's OS) and fails with "version '3.11' ... was not found for this
      # operating system". uv provisions and pins the interpreter itself, which is what it is
      # for, and behaves identically on GitHub-hosted runners.
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
          enable-cache: true
          cache-dependency-glob: qiko-core/uv.lock
      - run: uv python install 3.11
      - run: uv sync --frozen --extra dev --python 3.11
      - run: uv run ruff check . ../scripts/check_local_contract.py ../scripts/sync_openapi.py
      # -n 3, not `auto`: the self-hosted runner shares its 4 vCPU with the preprod services on
      # the same box, so one core is deliberately left for them. Serial the suite took ~26 min
      # here and pytest sat on a single core while three idled; this brings it to roughly a third
      # of that. `loadgroup` is required, not cosmetic: tests/test_agent_store.py and
      # tests/test_db_backed_rfp_tree.py each run drop_all + create_all against the same test
      # database and share an xdist_group so they cannot land on different workers concurrently.
      # Verified over four consecutive local runs: 1888 passed, 2 skipped, identical every time.
      - run: uv run pytest -n 3 --dist loadgroup   # enforces --cov-fail-under=80 from pyproject.toml

  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 9.12.0}
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml}
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm --filter creator test
      - run: pnpm --filter admin test
      - run: pnpm --filter @qiko/api-client generate
      - run: git diff --exit-code -- ../qiko-core/openapi.json packages/api-client/openapi.json packages/api-client/src/schema.d.ts
      - run: pnpm -r build   # typecheck + Next production build for creator + admin

  e2e:
    # The mocked end-to-end specs. They stub every backend call with page.route(), so they need
    # the creator app and nothing else: no preprod, no credentials, no seeded data.
    #
    # They used to run only under the manual QA runner in .devin/qa. That went three weeks without
    # a run, and in the meantime three intentional product changes moved past their specs: the
    # delete confirmation modal, the Integrations tab rename, and a copy rename. The next QA run
    # reported ten failures and not one was a real regression. Every one of them would have failed
    # here, on the pull request that caused it.
    #
    # Specs that reach a real deployed environment (website-parity, the legal-consent suite) are
    # deliberately NOT here: those stay behind the guarded runner that enforces the network
    # allowlist.
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 9.12.0}
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter creator build
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend/e2e
      # Selected by title, not by line number. The QA runner selects by `spec:line` and its table
      # silently rotted: three entries pointed at ordinary statements, so Playwright matched
      # nothing and reported success having run zero of that spec. Titles survive edits.
      - run: |
          pnpm exec playwright test --config playwright.ci.config.ts \
            tests/sales-pipeline-rail.spec.ts \
            tests/sales-source-toggle.spec.ts \
            tests/sales-scan-history.spec.ts \
            tests/sales-activity-timeline.spec.ts \
            tests/sales-ingest-filter.spec.ts \
            tests/sales-source-catalog.spec.ts \
            tests/qik313-settings.spec.ts \
            tests/qik338-push-to-studio.spec.ts \
            tests/finance-drilldown.spec.ts
        working-directory: frontend/e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-evidence
          path: |
            frontend/e2e/test-results-ci
            frontend/e2e/playwright-report-ci
          retention-days: 7

  ci-status:
    # One check to require on the protected branches. Every other job here is conditional on the
    # path filter, so requiring them directly would block a promotion PR forever: a promotion
    # touches no backend code, `backend` is skipped, and a required check that never reports is a
    # merge that never happens.
    #
    # `always()` so this runs even when a dependency is skipped, and the result is computed rather
    # than inherited: skipped is fine (the filter decided that code was untouched), failed or
    # cancelled is not. Without the explicit check, `needs` alone would skip this job too and it
    # would report nothing.
    name: CI Status
    if: always()
    needs: [changes, compose, backend, frontend, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job did not succeed or skip
        env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.compose.result }} ${{ needs.backend.result }} ${{ needs.frontend.result }} ${{ needs.e2e.result }}
        run: |
          set -euo pipefail
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a required job reported '$result'"; exit 1 ;;
            esac
          done
          echo "All CI gates passed or were skipped by the path filter."
