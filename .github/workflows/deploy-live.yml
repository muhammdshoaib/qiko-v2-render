name: Deploy Live (production)

# PRODUCTION deploy. Modelled on deploy-preprod.yml but DELIBERATELY manual-only: there is NO
# `push` trigger, so nothing ever auto-deploys to production. It runs only on an explicit
# workflow_dispatch, and the `live` GitHub Environment adds a second gate (required reviewers /
# wait timer / protected secrets) that must be configured on the repo. A typed confirmation
# ("deploy-live") guards against an accidental run.
#
# Delivery model is identical to preprod: a clean `git archive` tarball is shipped to the live box
# via S3, then swapped in on the host via AWS SSM Run Command (the org disables deploy keys and
# port 22 is closed, so there is no host-side git pull). The on-box script validates all required
# services. Rollback is manual and migration-aware, never raced automatically after a failure.
#
# The production box is NOT hardcoded: its SSM instance id comes from the secret
# LIVE_SSM_INSTANCE_ID (documented in docs/playbooks/live.md). Set it before the first run.
on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-live" to confirm a PRODUCTION deploy'
        required: true
        default: ""
      release_sha:
        description: 'Exact 40-character commit SHA already verified in preprod'
        required: true
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-live
  cancel-in-progress: false

env:
  # Live deploy bucket. Mirrors the preprod naming convention (qiko-v2-<env>-deploy-<accountid>).
  # Must exist with CI read/write + host-role read (see docs/playbooks/live.md). If you prefer not
  # to hardcode it, replace with ${{ vars.LIVE_DEPLOY_BUCKET }} and set the repo variable.
  DEPLOY_BUCKET: qiko-v2-live-deploy-064247010239

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Second gate: configure the `live` environment in repo settings with required reviewers so a
    # human must approve every production run. Production secrets can be scoped to this environment.
    environment: live
    steps:
      # Only applies to the manual escape hatch: a merge into `production` is itself the
      # confirmation, gated by branch protection on that branch.
      - name: Guard - require explicit confirmation (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          DEPLOY_CONFIRM: ${{ inputs.confirm }}
        run: |
          if [[ "$DEPLOY_CONFIRM" != "deploy-live" ]]; then
            echo "::error::Refusing to deploy: type 'deploy-live' in the confirm input to proceed."
            exit 1
          fi

      - name: Resolve the commit being deployed
        id: rel
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SHA="${{ inputs.release_sha }}"
          else
            SHA="${{ github.sha }}"
          fi
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release SHA must be 40 lowercase hex characters, got '$SHA'"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.rel.outputs.sha }}
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.LIVE_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Promotion is PR-based, so the commit landing on `production` is a merge commit with its
      # own SHA, not the preprod SHA. What has to match is the CONTENT: this commit's tree must be
      # byte-identical to the tree of the commit deployed and verified on preprod, and must
      # descend from it. That still refuses anything preprod has not validated, and additionally
      # refuses a promotion PR that introduces a change of its own.
      - name: Verify release provenance against preprod
        env:
          RELEASE_SHA: ${{ steps.rel.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
            echo "::error::checked out SHA mismatch"
            exit 1
          fi
          PREPROD_SHA=$(aws ssm get-parameter --name /qiko/preprod/DEPLOYED_SHA --query Parameter.Value --output text)
          if [[ ! "$PREPROD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::no valid preprod-verified SHA recorded (got '$PREPROD_SHA'); deploy to preprod first"
            exit 1
          fi
          git fetch origin "$PREPROD_SHA" --depth=1 2>/dev/null || git fetch origin
          if ! git cat-file -e "${PREPROD_SHA}^{commit}" 2>/dev/null; then
            echo "::error::the preprod-verified commit $PREPROD_SHA is not present in this repository"
            exit 1
          fi
          RELEASE_TREE=$(git rev-parse "${RELEASE_SHA}^{tree}")
          PREPROD_TREE=$(git rev-parse "${PREPROD_SHA}^{tree}")
          echo "release $RELEASE_SHA tree=$RELEASE_TREE"
          echo "preprod $PREPROD_SHA tree=$PREPROD_TREE"
          if [[ "$RELEASE_TREE" != "$PREPROD_TREE" ]]; then
            echo "::error::this commit's content differs from what was verified on preprod ($PREPROD_SHA)."
            echo "::error::Promote through preprod first; do not add changes in the production PR."
            git --no-pager diff --stat "$PREPROD_SHA" "$RELEASE_SHA" || true
            exit 1
          fi
          if ! git merge-base --is-ancestor "$PREPROD_SHA" "$RELEASE_SHA"; then
            echo "::error::$RELEASE_SHA does not descend from the preprod-verified commit $PREPROD_SHA"
            exit 1
          fi

      - name: Package immutable code artifact and checksum
        env:
          RELEASE_SHA: ${{ steps.rel.outputs.sha }}
        run: |
          set -euo pipefail
          # Publish only the exact commit whose content preprod verified.
          git archive --format=tar.gz -o /tmp/qiko-v2.tar.gz "$RELEASE_SHA"
          sha256sum /tmp/qiko-v2.tar.gz | cut -d ' ' -f1 > /tmp/qiko-v2.tar.gz.sha256
          aws s3 cp /tmp/qiko-v2.tar.gz "s3://$DEPLOY_BUCKET/live/deploy-${RELEASE_SHA}.tar.gz"
          aws s3 cp /tmp/qiko-v2.tar.gz.sha256 "s3://$DEPLOY_BUCKET/live/deploy-${RELEASE_SHA}.tar.gz.sha256"

      - name: Deploy via SSM
        id: deploy
        env:
          RELEASE_SHA: ${{ steps.rel.outputs.sha }}
        run: |
          set -e
          ARTIFACT_SHA256=$(cat /tmp/qiko-v2.tar.gz.sha256)
          { head -n 1 .github/deploy/redeploy-live.sh; printf 'export RELEASE_SHA=%q RELEASE_SHA256=%q\n' "$RELEASE_SHA" "$ARTIFACT_SHA256"; tail -n +2 .github/deploy/redeploy-live.sh; } | jq -Rs '{commands: [.]}' > /tmp/redeploy.json
          CMD_ID=$(aws ssm send-command --instance-ids "${{ secrets.LIVE_SSM_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --parameters file:///tmp/redeploy.json \
            --timeout-seconds 900 --query "Command.CommandId" --output text)
          echo "Command: $CMD_ID"
          STATUS=Pending
          # SSM allows 900 seconds. Poll beyond that timeout so a still-running command is never
          # mistaken for failure while it is mutating the release directory or database.
          for i in $(seq 1 70); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ secrets.LIVE_SSM_INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo Pending)
            echo "status=$STATUS"
            [[ "$STATUS" =~ ^(Success|Failed|Cancelled|TimedOut)$ ]] && break
            sleep 15
          done
          if [[ ! "$STATUS" =~ ^(Success|Failed|Cancelled|TimedOut)$ ]]; then
            echo "command is still non-terminal after the SSM timeout; cancelling before exit"
            aws ssm cancel-command --command-id "$CMD_ID"
            for i in $(seq 1 20); do
              STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ secrets.LIVE_SSM_INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo Cancelling)
              echo "cancel-status=$STATUS"
              [[ "$STATUS" =~ ^(Success|Failed|Cancelled|TimedOut)$ ]] && break
              sleep 10
            done
          fi
          [[ "$STATUS" == "Success" ]] || { echo "::error::deploy command ended with $STATUS"; exit 1; }

      # The SSM command exiting zero only means the containers were started. It says nothing about
      # whether the service can reach its database, so a live deploy could previously be declared
      # successful while the app was unable to serve a single authenticated request.
      - name: Readiness check
        run: |
          ok=false
          for i in $(seq 1 18); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://qiko.ai/api/v1/health/ready || echo 000)
            echo "ready=$CODE"
            if [[ "$CODE" == "200" ]]; then ok=true; break; fi
            sleep 10
          done
          if [[ "$ok" != "true" ]]; then
            echo "::error::live is not ready after deploy; failing checks:"
            curl -s https://qiko.ai/api/v1/health/ready || true
            echo "::error::Follow docs/playbooks/live.md. Do NOT start another deploy until the cause is known."
            exit 1
          fi

      # Production rollback is deliberately manual. An older artifact may not understand a newer
      # Alembic revision, so an automatic second deploy can race or compound a schema failure.
      - name: Report controlled failure
        if: failure()
        run: |
          echo "::error::Live deploy failed. Do not start another deploy until the SSM command is terminal."
          echo "Follow docs/playbooks/live.md: inspect logs and schema, then run the reviewed rollback."
