name: Deploy Live (production)

# PRODUCTION deploy. Modelled on deploy-preprod.yml but DELIBERATELY manual-only: there is NO
# `push` trigger, so nothing ever auto-deploys to production. It runs only on an explicit
# workflow_dispatch, and the `live` GitHub Environment adds a second gate (required reviewers /
# wait timer / protected secrets) that must be configured on the repo. A typed confirmation
# ("deploy-live") guards against an accidental run.
#
# Delivery model is identical to preprod: a clean `git archive` tarball is shipped to the live box
# via S3, then swapped in on the host via AWS SSM Run Command (the org disables deploy keys and
# port 22 is closed, so there is no host-side git pull). Health-check + automatic rollback to the
# previous artifact on failure.
#
# The production box is NOT hardcoded: its SSM instance id comes from the secret
# LIVE_SSM_INSTANCE_ID (documented in docs/playbooks/live.md). Set it before the first run.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-live" to confirm a PRODUCTION deploy'
        required: true
        default: ""

concurrency:
  group: deploy-live
  cancel-in-progress: false

env:
  # Live deploy bucket. Mirrors the preprod naming convention (qiko-v2-<env>-deploy-<accountid>).
  # Must exist with CI read/write + host-role read (see docs/playbooks/live.md). If you prefer not
  # to hardcode it, replace with ${{ vars.LIVE_DEPLOY_BUCKET }} and set the repo variable.
  DEPLOY_BUCKET: qiko-v2-live-deploy-064247010239

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Second gate: configure the `live` environment in repo settings with required reviewers so a
    # human must approve every production run. Production secrets can be scoped to this environment.
    environment: live
    steps:
      - name: Guard - require explicit confirmation
        run: |
          if [[ "${{ github.event.inputs.confirm }}" != "deploy-live" ]]; then
            echo "::error::Refusing to deploy: type 'deploy-live' in the confirm input to proceed."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package code and upload to S3 (snapshot previous for rollback)
        run: |
          set -e
          # Keep the currently-live artifact as the rollback target (no-op on the first deploy).
          aws s3 cp "s3://$DEPLOY_BUCKET/live/deploy-latest.tar.gz" \
            "s3://$DEPLOY_BUCKET/live/deploy-previous.tar.gz" || echo "no existing latest yet"
          # Clean, tracked-files-only source archive (no .git / node_modules / untracked).
          git archive --format=tar.gz -o /tmp/qiko-v2.tar.gz HEAD
          aws s3 cp /tmp/qiko-v2.tar.gz "s3://$DEPLOY_BUCKET/live/deploy-${{ github.sha }}.tar.gz"
          aws s3 cp /tmp/qiko-v2.tar.gz "s3://$DEPLOY_BUCKET/live/deploy-latest.tar.gz"

      - name: Deploy via SSM
        id: deploy
        run: |
          set -e
          jq -Rs '{commands: [.]}' < .github/deploy/redeploy-live.sh > /tmp/redeploy.json
          CMD_ID=$(aws ssm send-command --instance-ids "${{ secrets.LIVE_SSM_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --parameters file:///tmp/redeploy.json \
            --timeout-seconds 900 --query "Command.CommandId" --output text)
          echo "Command: $CMD_ID"
          STATUS=Pending
          for i in $(seq 1 50); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ secrets.LIVE_SSM_INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo Pending)
            echo "status=$STATUS"
            [[ "$STATUS" =~ ^(Success|Failed|Cancelled|TimedOut)$ ]] && break
            sleep 15
          done
          [[ "$STATUS" == "Success" ]] || { echo "::error::deploy command ended with $STATUS"; exit 1; }

      - name: Health check
        run: |
          ok=false
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://qiko.ai/api/v1/health || echo 000)
            echo "health=$CODE"
            if [[ "$CODE" == "200" ]]; then ok=true; break; fi
            sleep 10
          done
          [[ "$ok" == "true" ]] || exit 1

      - name: Rollback to previous artifact on failure
        if: failure()
        run: |
          set -e
          if aws s3 ls "s3://$DEPLOY_BUCKET/live/deploy-previous.tar.gz"; then
            echo "Restoring previous artifact and redeploying..."
            aws s3 cp "s3://$DEPLOY_BUCKET/live/deploy-previous.tar.gz" \
              "s3://$DEPLOY_BUCKET/live/deploy-latest.tar.gz"
            jq -Rs '{commands: [.]}' < .github/deploy/redeploy-live.sh > /tmp/redeploy.json
            CMD_ID=$(aws ssm send-command --instance-ids "${{ secrets.LIVE_SSM_INSTANCE_ID }}" \
              --document-name AWS-RunShellScript \
              --parameters file:///tmp/redeploy.json \
              --timeout-seconds 900 --query "Command.CommandId" --output text)
            echo "Rollback command sent: $CMD_ID"
          else
            echo "No previous artifact to roll back to."
          fi
