name: Deploy Live (production)

# PRODUCTION deploy. Modelled on deploy-preprod.yml but DELIBERATELY manual-only: there is NO
# `push` trigger, so nothing ever auto-deploys to production. It runs only on an explicit
# workflow_dispatch, and the `live` GitHub Environment adds a second gate (required reviewers /
# wait timer / protected secrets) that must be configured on the repo. A typed confirmation
# ("deploy-live") guards against an accidental run.
#
# Delivery model is identical to preprod: a clean `git archive` tarball is shipped to the live box
# via S3, then swapped in on the host via AWS SSM Run Command (the org disables deploy keys and
# port 22 is closed, so there is no host-side git pull). The on-box script validates all required
# services. Rollback is manual and migration-aware, never raced automatically after a failure.
#
# The production box is NOT hardcoded: its SSM instance id comes from the secret
# LIVE_SSM_INSTANCE_ID (documented in docs/playbooks/live.md). Set it before the first run.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-live" to confirm a PRODUCTION deploy'
        required: true
        default: ""
      release_sha:
        description: 'Exact 40-character commit SHA already verified in preprod'
        required: true
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-live
  cancel-in-progress: false

env:
  # Live deploy bucket. Mirrors the preprod naming convention (qiko-v2-<env>-deploy-<accountid>).
  # Must exist with CI read/write + host-role read (see docs/playbooks/live.md). If you prefer not
  # to hardcode it, replace with ${{ vars.LIVE_DEPLOY_BUCKET }} and set the repo variable.
  DEPLOY_BUCKET: qiko-v2-live-deploy-064247010239

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Second gate: configure the `live` environment in repo settings with required reviewers so a
    # human must approve every production run. Production secrets can be scoped to this environment.
    environment: live
    steps:
      - name: Guard - require explicit confirmation
        env:
          DEPLOY_CONFIRM: ${{ inputs.confirm }}
        run: |
          if [[ "$DEPLOY_CONFIRM" != "deploy-live" ]]; then
            echo "::error::Refusing to deploy: type 'deploy-live' in the confirm input to proceed."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.LIVE_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify immutable release provenance
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -e
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::release_sha must be 40 lowercase hex characters"; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || { echo "::error::checked out SHA mismatch"; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || { echo "::error::release SHA is not reachable from origin/main"; exit 1; }
          PREPROD_SHA=$(aws ssm get-parameter --name /qiko/preprod/DEPLOYED_SHA --query Parameter.Value --output text)
          [[ "$PREPROD_SHA" == "$RELEASE_SHA" ]] || { echo "::error::release SHA was not verified in preprod"; exit 1; }

      - name: Package immutable code artifact and checksum
        run: |
          set -e
          # Publish only the exact preprod-verified SHA and checksum.
          git archive --format=tar.gz -o /tmp/qiko-v2.tar.gz "${{ inputs.release_sha }}"
          sha256sum /tmp/qiko-v2.tar.gz | cut -d ' ' -f1 > /tmp/qiko-v2.tar.gz.sha256
          aws s3 cp /tmp/qiko-v2.tar.gz "s3://$DEPLOY_BUCKET/live/deploy-${{ inputs.release_sha }}.tar.gz"
          aws s3 cp /tmp/qiko-v2.tar.gz.sha256 "s3://$DEPLOY_BUCKET/live/deploy-${{ inputs.release_sha }}.tar.gz.sha256"

      - name: Deploy via SSM
        id: deploy
        run: |
          set -e
          ARTIFACT_SHA256=$(cat /tmp/qiko-v2.tar.gz.sha256)
          { head -n 1 .github/deploy/redeploy-live.sh; printf 'export RELEASE_SHA=%q RELEASE_SHA256=%q\n' '${{ inputs.release_sha }}' "$ARTIFACT_SHA256"; tail -n +2 .github/deploy/redeploy-live.sh; } | jq -Rs '{commands: [.]}' > /tmp/redeploy.json
          CMD_ID=$(aws ssm send-command --instance-ids "${{ secrets.LIVE_SSM_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --parameters file:///tmp/redeploy.json \
            --timeout-seconds 900 --query "Command.CommandId" --output text)
          echo "Command: $CMD_ID"
          STATUS=Pending
          # SSM allows 900 seconds. Poll beyond that timeout so a still-running command is never
          # mistaken for failure while it is mutating the release directory or database.
          for i in $(seq 1 70); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ secrets.LIVE_SSM_INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo Pending)
            echo "status=$STATUS"
            [[ "$STATUS" =~ ^(Success|Failed|Cancelled|TimedOut)$ ]] && break
            sleep 15
          done
          if [[ ! "$STATUS" =~ ^(Success|Failed|Cancelled|TimedOut)$ ]]; then
            echo "command is still non-terminal after the SSM timeout; cancelling before exit"
            aws ssm cancel-command --command-id "$CMD_ID"
            for i in $(seq 1 20); do
              STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ secrets.LIVE_SSM_INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo Cancelling)
              echo "cancel-status=$STATUS"
              [[ "$STATUS" =~ ^(Success|Failed|Cancelled|TimedOut)$ ]] && break
              sleep 10
            done
          fi
          [[ "$STATUS" == "Success" ]] || { echo "::error::deploy command ended with $STATUS"; exit 1; }

      # Production rollback is deliberately manual. An older artifact may not understand a newer
      # Alembic revision, so an automatic second deploy can race or compound a schema failure.
      - name: Report controlled failure
        if: failure()
        run: |
          echo "::error::Live deploy failed. Do not start another deploy until the SSM command is terminal."
          echo "Follow docs/playbooks/live.md: inspect logs and schema, then run the reviewed rollback."
