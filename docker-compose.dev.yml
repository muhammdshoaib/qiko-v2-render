services:
  qiko-core:
    environment:
      - ENVIRONMENT=dev
      - LOG_LEVEL=DEBUG
      - USE_DB_STORES=true
      - TASK_BACKEND=arq
      - FORWARDED_ALLOW_IPS=172.28.30.2
      - 'CORS_ALLOW_ORIGINS=["http://qiko.localhost:${QIKO_DEV_HTTP_PORT:-8080}","http://admin.qiko.localhost:${QIKO_DEV_HTTP_PORT:-8080}"]'
      - PUBLIC_BASE_URL=http://qiko.localhost:${QIKO_DEV_HTTP_PORT:-8080}
      - COOKIE_DOMAIN=.qiko.localhost
      - LEGACY_COOKIE_DOMAIN=
    ports:
      - "127.0.0.1:${QIKO_DEV_API_PORT:-8000}:8000"

  worker:
    environment:
      - ENVIRONMENT=dev
      - LOG_LEVEL=DEBUG
      - USE_DB_STORES=true
      - TASK_BACKEND=arq

  caddy:
    image: caddy:2
    environment:
      - CREATOR_UPSTREAM=host.docker.internal:${QIKO_DEV_CREATOR_PORT:-3000}
      - ADMIN_UPSTREAM=host.docker.internal:${QIKO_DEV_ADMIN_PORT:-3001}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:${QIKO_DEV_HTTP_PORT:-8080}:8080"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
    depends_on:
      - qiko-core
    restart: unless-stopped
    networks:
      proxy-net:
        ipv4_address: 172.28.30.2

networks:
  proxy-net:
    ipam:
      config:
        - subnet: 172.28.30.0/24
          ip_range: 172.28.30.128/25
          gateway: 172.28.30.1
