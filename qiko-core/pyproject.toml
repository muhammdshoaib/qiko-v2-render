[project]
name = "qiko-core"
version = "0.1.0"
description = "Qiko v2 core: AI-first agentic modular monolith"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.35,<2.1",
    "asyncpg>=0.30,<0.31",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<1.14",
    "redis>=5.2,<6",
    "pyjwt>=2.9,<3",
    "pyotp>=2.9,<3",
    "arq>=0.26,<0.27",
    "pypdf>=5.1,<6",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
    "reportlab>=4.2,<5",
    "cryptography>=43,<45",
    "httpx>=0.27,<0.28",
    "python-multipart>=0.0.9,<0.1",
    "boto3>=1.35,<2",
    "phonenumbers>=9.0.38",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6.0,<7",
    "ruff>=0.7,<0.8",
    "aiosqlite>=0.20,<0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
# app/main.py is deliberately NOT omitted: it holds create_app() and the production
# wiring branch, which is exactly the code that regressed unnoticed (see tests/test_production_wiring.py).
omit = []

[tool.ruff]
line-length = 110
target-version = "py311"
