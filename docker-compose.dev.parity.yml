services:
  caddy:
    environment:
      - CREATOR_UPSTREAM=creator:3000
      - ADMIN_UPSTREAM=admin:3001

  creator:
    build:
      args:
        NEXT_PUBLIC_API_BASE: /api/v1

  admin:
    build:
      args:
        NEXT_PUBLIC_API_BASE: /api/v1
        NEXT_PUBLIC_CREATOR_BASE_URL: http://qiko.localhost:${QIKO_DEV_HTTP_PORT:-8080}
