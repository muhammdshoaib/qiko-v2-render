# Preprod / staging (client-facing validation). Production-like, no host DB port exposure.
# Run: COMPOSE_PROJECT_NAME=qiko-preprod docker compose -f docker-compose.yml -f docker-compose.preprod.yml up -d --build
services:
  qiko-core:
    environment:
      - ENVIRONMENT=preprod
      - LOG_LEVEL=INFO
      - FORWARDED_ALLOW_IPS=172.28.10.2

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: { qiko-core: { condition: service_healthy }, creator: { condition: service_started }, admin: { condition: service_started } }
    networks:
      proxy-net:
        ipv4_address: 172.28.10.2

networks:
  proxy-net:
    name: ${COMPOSE_PROJECT_NAME:-qiko-preprod}_proxy_net_v2
    ipam:
      config:
        - subnet: 172.28.10.0/24
          ip_range: 172.28.10.128/25
          gateway: 172.28.10.1

volumes:
  caddy_data:
  caddy_config:
