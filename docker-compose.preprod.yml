# Preprod / staging (client-facing validation). Production-like, no host DB port exposure.
# Run: COMPOSE_PROJECT_NAME=qiko-preprod docker compose -f docker-compose.yml -f docker-compose.preprod.yml up -d
services:
  qiko-core:
    environment:
      - ENVIRONMENT=preprod
      - LOG_LEVEL=INFO
    deploy:
      resources:
        limits: {memory: 512M, cpus: "1.0"}
